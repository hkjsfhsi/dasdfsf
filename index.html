<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>柏努利方程实验 - 智能数据分析平台</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: "PingFang SC", "Hiragino Sans GB", sans-serif;
    }
    body {
      max-width: 1500px;
      margin: 30px auto;
      padding: 0 25px;
      line-height: 1.7;
      background: linear-gradient(45deg, #2c3e50, #4a6990);
      min-height: 100vh;
    }
    .page-title {
      text-align: center;
      color: #ffffff;
      margin-bottom: 40px;
      text-shadow: 3px 3px 6px rgba(0,0,0,0.4);
      font-size: 2.8em;
      letter-spacing: 2px;
    }
    .card {
      margin: 30px 0;
      padding: 30px;
      border-radius: 20px;
      background: rgba(255,255,255,0.96);
      backdrop-filter: blur(15px);
      box-shadow: 0 10px 40px rgba(0,0,0,0.12);
      border: 1px solid rgba(255,255,255,0.2);
    }
    .card-title {
      color: #2980b9;
      margin-bottom: 25px;
      border-left: 6px solid #2980b9;
      padding-left: 20px;
      font-size: 1.6em;
      font-weight: 700;
    }
    .experiment-group {
      margin: 25px 0;
      padding: 25px;
      border-radius: 15px;
      background: #ffffff;
      box-shadow: 0 5px 15px rgba(0,0,0,0.05);
      border: 1px solid #f1f5f9;
    }
    .group-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      padding-bottom: 15px;
      border-bottom: 3px solid #f8fafc;
    }
    .group-name-input {
      font-size: 1.4em;
      border: none;
      border-bottom: 2px solid #2980b9;
      background: transparent;
      color: #2980b9;
      font-weight: 700;
      width: 220px;
      outline: none;
    }
    .btn-wrap {
      display: flex;
      gap: 15px;
      margin: 25px 0;
      flex-wrap: wrap;
    }
    .btn {
      padding: 12px 24px;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      font-size: 15px;
      font-weight: 600;
      transition: all 0.3s ease-in-out;
      background: #e2e8f0;
      color: #334155;
    }
    .btn:hover {
      transform: translateY(-3px);
      box-shadow: 0 6px 18px rgba(0,0,0,0.15);
    }
    .btn-primary { background: linear-gradient(45deg, #2980b9, #6dd5fa); color: #fff; }
    .btn-danger { background: linear-gradient(45deg, #e74c3c, #ff7675); color: #fff; }
    .btn-success { background: linear-gradient(45deg, #27ae60, #7bed9f); color: #fff; }
    .btn-info { background: linear-gradient(45deg, #8e44ad, #a29bfe); color: #fff; }
    .btn-warning { background: linear-gradient(45deg, #f39c12, #ffbe76); color: #fff; }
    .btn-light { background: linear-gradient(45deg, #ecf0f1, #bdc3c7); color: #2c3e50; }
    .form-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 20px;
      margin: 25px 0;
    }
    .form-item {
      display: flex;
      flex-direction: column;
    }
    .form-label {
      font-size: 14px;
      color: #64748b;
      margin-bottom: 8px;
      font-weight: 600;
    }
    .form-input {
      padding: 12px;
      border: 2px solid #e2e8f0;
      border-radius: 10px;
      font-size: 15px;
      outline: none;
      transition: border 0.3s;
    }
    .form-input:focus {
      border-color: #2980b9;
    }
    .data-table {
      width: 100%;
      border-collapse: collapse;
      margin: 25px 0;
      background: #ffffff;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 3px 10px rgba(0,0,0,0.04);
    }
    .data-table th {
      background: linear-gradient(45deg, #2980b9, #6dd5fa);
      color: #ffffff;
      padding: 15px;
      text-align: center;
      font-weight: 600;
      font-size: 15px;
    }
    .data-table td {
      padding: 14px;
      text-align: center;
      border-bottom: 1px solid #f1f5f9;
      font-size: 14px;
    }
    .data-table input {
      width: 100%;
      padding: 10px;
      border: 1px solid #e2e8f0;
      border-radius: 6px;
      text-align: center;
      font-size: 14px;
      outline: none;
    }
    .chart-box {
      height: 520px;
      margin: 25px 0;
      background: #ffffff;
      padding: 25px;
      border-radius: 15px;
      box-shadow: 0 5px 15px rgba(0,0,0,0.05);
    }
    .tab-nav {
      display: flex;
      gap: 12px;
      margin-bottom: 25px;
      flex-wrap: wrap;
    }
    .tab-item {
      padding: 14px 28px;
      border: none;
      border-radius: 30px;
      cursor: pointer;
      background: #f1f5f9;
      color: #64748b;
      font-weight: 600;
      font-size: 15px;
      transition: all 0.3s;
    }
    .tab-item.active {
      background: linear-gradient(45deg, #2980b9, #6dd5fa);
      color: #ffffff;
    }
    .file-input {
      display: none;
    }
    .tip-box {
      padding: 18px;
      border-radius: 10px;
      margin: 15px 0;
      display: none;
      font-size: 15px;
    }
    .tip-success {
      background: #dcfce7;
      color: #166534;
      border: 1px solid #bbf7d0;
    }
    .tip-error {
      background: #fee2e2;
      color: #991b1b;
      border: 1px solid #fecdd3;
    }
    .stat-card {
      display: inline-block;
      background: linear-gradient(45deg, #e0f2fe, #bae6fd);
      color: #0369a1;
      padding: 18px 30px;
      border-radius: 12px;
      margin: 12px 12px 12px 0;
      box-shadow: 0 3px 8px rgba(0,0,0,0.06);
    }
    .stat-card h4 {
      font-size: 14px;
      margin-bottom: 5px;
    }
    .stat-card p {
      font-size: 1.2em;
      font-weight: 700;
    }
    .report-content {
      background: #ffffff;
      padding: 35px;
      border-radius: 15px;
      box-shadow: 0 5px 15px rgba(0,0,0,0.05);
    }
    .report-content h3 {
      color: #2980b9;
      margin-bottom: 25px;
      padding-bottom: 15px;
      border-bottom: 3px solid #e0f2fe;
      font-size: 1.8em;
    }
    .report-content h4 {
      color: #334155;
      margin: 20px 0 15px;
      font-size: 1.3em;
    }
    .principle-box {
      background: #e0f2fe;
      padding: 20px;
      border-radius: 10px;
      margin: 10px 0 20px;
      border-left: 5px solid #2980b9;
    }
    .conclusion-box {
      padding: 20px;
      border-radius: 10px;
      margin: 10px 0;
    }
  </style>
</head>
<body>
  <h1 class="page-title">柏努利方程实验 - 智能数据分析平台</h1>

  <!-- 实验数据记录模块 -->
  <div class="card">
    <h2 class="card-title">实验数据记录</h2>
    <div class="btn-wrap">
      <button class="btn btn-primary" onclick="createNewGroup()">新增实验组</button>
      <button class="btn btn-info" onclick="document.getElementById('csv-import').click()">导入CSV数据</button>
      <button class="btn btn-success" onclick="renderAllCharts()">绘制所有对比曲线</button>
      <button class="btn btn-warning" onclick="exportCsvData()">导出CSV数据</button>
      <button class="btn btn-light" onclick="createExperimentReport()">生成实验报告</button>
    </div>
    <input type="file" id="csv-import" class="file-input" accept=".csv" onchange="readCsvFile(event)">
    <div id="tip-container" class="tip-box"></div>
    <div id="experiment-container"></div>
  </div>

  <!-- 图表分析模块 -->
  <div class="card">
    <h2 class="card-title">实验结果与图表分析</h2>
    <div class="tab-nav">
      <button class="tab-item active" onclick="changeTab('totalHead', this)">总水头线</button>
      <button class="tab-item" onclick="changeTab('pressureHead', this)">测压管水头线</button>
      <button class="tab-item" onclick="changeTab('velocityHead', this)">流速水头</button>
      <button class="tab-item" onclick="changeTab('positionHead', this)">位置水头线</button>
    </div>
    <div class="chart-box">
      <canvas id="main-chart"></canvas>
    </div>
  </div>

  <!-- 实验报告模块 -->
  <div class="card">
    <h2 class="card-title">实验报告</h2>
    <div id="report-container">
      <p style="color: #94a3b8; text-align: center; padding: 50px 0; font-size: 16px;">点击上方「生成实验报告」按钮，查看完整分析报告</p>
    </div>
  </div>

  <!-- 引入Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script>
    // 全局变量
    let experimentList = []; // 实验组列表
    let mainChart = null;    // 主图表实例
    let activeTab = 'totalHead'; // 激活的标签页
    const gravity = 9.81;    // 重力加速度

    // 页面加载初始化
    window.onload = function() {
      createNewGroup(); // 默认添加一个实验组
      initMainChart();  // 初始化图表
    };

    // 初始化图表
    function initMainChart() {
      const chartDom = document.getElementById('main-chart').getContext('2d');
      mainChart = new Chart(chartDom, {
        type: 'line',
        data: { labels: [], datasets: [] },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: {
            legend: { position: 'top', font: { size: 14 } },
            title: { display: true, text: '柏努利方程水头分布曲线', font: { size: 20, weight: 'bold' } }
          },
          scales: {
            y: {
              beginAtZero: false,
              title: { display: true, text: '水头高度 (m)', font: { size: 16 } },
              grid: { color: '#f1f5f9' }
            },
            x: {
              grid: { color: '#f1f5f9' },
              title: { display: true, text: '测点编号', font: { size: 16 } }
            }
          },
          elements: {
            point: { radius: 5, hoverRadius: 7 },
            line: { tension: 0.4 }
          }
        }
      });
    }

    // 显示提示框
    function showTip(message, type = 'success') {
      const tipBox = document.getElementById('tip-container');
      tipBox.textContent = message;
      tipBox.className = `tip-box tip-${type}`;
      tipBox.style.display = 'block';
      setTimeout(() => { tipBox.style.display = 'none'; }, 3500);
    }

    // 新增实验组
    function createNewGroup() {
      const groupId = experimentList.length > 0 ? Math.max(...experimentList.map(g => g.id)) + 1 : 1;
      // 初始化实验组数据
      const newGroup = {
        id: groupId,
        name: `实验组${groupId}`,
        flow: 1.5, // 体积流量 m³/h
        points: [
          { no: 1, diameter: 20, height: 0.5, pressureHead: 0.35 },
          { no: 2, diameter: 15, height: 0.4, pressureHead: 0.38 },
          { no: 3, diameter: 10, height: 0.3, pressureHead: 0.42 },
          { no: 4, diameter: 15, height: 0.4, pressureHead: 0.38 },
          { no: 5, diameter: 20, height: 0.5, pressureHead: 0.35 }
        ]
      };
      experimentList.push(newGroup);
      renderAllGroups(); // 重新渲染所有实验组
    }

    // 新增测点
    function addMeasurePoint(groupId) {
      const targetGroup = experimentList.find(g => g.id === groupId);
      if (!targetGroup) return;
      const newNo = targetGroup.points.length + 1;
      const lastPoint = targetGroup.points[targetGroup.points.length - 1];
      targetGroup.points.push({
        no: newNo,
        diameter: lastPoint ? lastPoint.diameter : 10,
        height: lastPoint ? lastPoint.height : 0,
        pressureHead: lastPoint ? lastPoint.pressureHead : 0
      });
      renderAllGroups();
    }

    // 删除最后一个测点
    function delLastMeasurePoint(groupId) {
      const targetGroup = experimentList.find(g => g.id === groupId);
      if (!targetGroup || targetGroup.points.length <= 3) {
        showTip('每组至少保留3个测点，无法继续删除', 'error');
        return;
      }
      targetGroup.points.pop();
      renderAllGroups();
    }

    // 删除实验组
    function delExperimentGroup(groupId) {
      if (confirm('确认删除该实验组吗？删除后数据无法恢复！')) {
        experimentList = experimentList.filter(g => g.id !== groupId);
        renderAllGroups();
        // 重新绘制图表
        if (experimentList.length > 0) renderAllCharts();
        else mainChart.data.datasets = []; mainChart.update();
      }
    }

    // 更新实验组名称
    function updateGroupName(groupId, newName) {
      const targetGroup = experimentList.find(g => g.id === groupId);
      if (targetGroup) targetGroup.name = newName.trim() || `实验组${groupId}`;
    }

    // 更新体积流量
    function updateFlowRate(groupId, newFlow) {
      const targetGroup = experimentList.find(g => g.id === groupId);
      if (targetGroup) targetGroup.flow = parseFloat(newFlow) || 0;
    }

    // 更新测点数据
    function updatePointData(groupId, pointNo, key, value) {
      const targetGroup = experimentList.find(g => g.id === groupId);
      if (!targetGroup) return;
      const targetPoint = targetGroup.points.find(p => p.no === pointNo);
      if (targetPoint) targetPoint[key] = parseFloat(value) || 0;
    }

    // 渲染所有实验组
    function renderAllGroups() {
      const container = document.getElementById('experiment-container');
      container.innerHTML = '';

      experimentList.forEach(group => {
        // 生成计算结果表格（如果已计算）
        let resultTable = '';
        if (group.points[0] && group.points[0].velocity !== undefined) {
          resultTable = `<table class="data-table"><tr><th>测点编号</th><th>流速(m/s)</th><th>流速水头(m)</th><th>总水头(m)</th></tr>`;
          group.points.forEach(p => {
            resultTable += `<tr>
              <td>#${p.no}</td>
              <td>${p.velocity.toFixed(3)}</td>
              <td>${p.velHead.toFixed(4)}</td>
              <td><strong style="color:#2980b9;">${p.totalHead.toFixed(4)}</strong></td>
            </tr>`;
          });
          resultTable += `</table>`;
        }

        // 生成测点表格
        let pointTable = '';
        group.points.forEach(point => {
          pointTable += `<tr>
            <td><strong>#${point.no}</strong></td>
            <td><input type="number" step="0.1" value="${point.diameter}" oninput="updatePointData(${group.id},${point.no},'diameter',this.value)"></td>
            <td><input type="number" step="0.001" value="${point.height}" oninput="updatePointData(${group.id},${point.no},'height',this.value)"></td>
            <td><input type="number" step="0.001" value="${point.pressureHead}" oninput="updatePointData(${group.id},${point.no},'pressureHead',this.value)"></td>
          </tr>`;
        });

        // 拼接实验组DOM
        const groupDom = document.createElement('div');
        groupDom.className = 'experiment-group';
        groupDom.innerHTML = `
          <div class="group-header">
            <input type="text" class="group-name-input" value="${group.name}" onblur="updateGroupName(${group.id}, this.value)">
            <button class="btn btn-danger" onclick="delExperimentGroup(${group.id})">删除本组</button>
          </div>
          <div class="form-grid">
            <div class="form-item">
              <label class="form-label">体积流量 Q (m³/h)</label>
              <input type="number" step="0.01" class="form-input" value="${group.flow}" oninput="updateFlowRate(${group.id}, this.value)">
            </div>
            <div class="stat-card">
              <h4>当前测点数量</h4>
              <p>${group.points.length} 个</p>
            </div>
          </div>
          <table class="data-table">
            <thead><tr><th>测点编号</th><th>管径 d (mm)</th><th>位置高度 z (m)</th><th>测压管水头 h (m)</th></tr></thead>
            <tbody>${pointTable}</tbody>
          </table>
          <div class="btn-wrap">
            <button class="btn btn-primary" onclick="addMeasurePoint(${group.id})">添加测点</button>
            <button class="btn btn-light" onclick="delLastMeasurePoint(${group.id})">删除测点</button>
            <button class="btn btn-success" onclick="calculateHeadData(${group.id})">计算水头数据</button>
            <button class="btn btn-info" onclick="renderSingleChart(${group.id})">绘制本组曲线</button>
          </div>
          ${resultTable}
        `;
        container.appendChild(groupDom);
      });
    }

    // 计算水头相关数据
    function calculateHeadData(groupId) {
      const targetGroup = experimentList.find(g => g.id === groupId);
      if (!targetGroup) return;

      const flowRate = targetGroup.flow / 3600; // 转换为 m³/s
      targetGroup.points.forEach(point => {
        const diameter = point.diameter / 1000; // 转换为 m
        const area = Math.PI * Math.pow(diameter / 2, 2); // 过流面积
        const velocity = flowRate / area; // 流速
        const velHead = Math.pow(velocity, 2) / (2 * gravity); // 流速水头
        const totalHead = point.height + point.pressureHead + velHead; // 总水头

        // 赋值到测点数据
        point.velocity = velocity;
        point.velHead = velHead;
        point.totalHead = totalHead;
      });

      renderAllGroups();
      showTip(`${targetGroup.name} 水头数据计算完成！`);
      return targetGroup;
    }

    // 切换标签页
    function changeTab(tabName, element) {
      activeTab = tabName;
      // 切换激活样式
      document.querySelectorAll('.tab-item').forEach(tab => tab.classList.remove('active'));
      element.classList.add('active');
      // 重新绘制图表
      if (experimentList.length > 0 && experimentList[0].points[0].totalHead !== undefined) {
        renderAllCharts();
      }
    }

    // 获取标签页标题
    function getTabTitle() {
      const titleMap = {
        totalHead: '总水头线 (H = z + p/ρg + v²/2g)',
        pressureHead: '测压管水头线 (Hₚ = z + p/ρg)',
        velocityHead: '流速水头 (Hᵥ = v²/2g)',
        positionHead: '位置水头线 (z)'
      };
      return titleMap[activeTab] || '柏努利方程水头分布';
    }

    // 绘制所有实验组图表
    function renderAllCharts() {
      // 先计算所有未计算的实验组
      experimentList.forEach(group => {
        if (!group.points[0] || group.points[0].totalHead === undefined) {
          calculateHeadData(group.id);
        }
      });
      renderChart(experimentList);
    }

    // 绘制单个实验组图表
    function renderSingleChart(groupId) {
      const targetGroup = calculateHeadData(groupId);
      renderChart([targetGroup]);
    }

    // 核心图表绘制
    function renderChart(showGroups) {
      if (!mainChart) initMainChart();
      // 图表配色方案
      const colorList = ['#2980b9', '#e74c3c', '#27ae60', '#8e44ad', '#f39c12', '#17a2b8', '#6f42c1', '#dc3545'];
      // 测点标签
      const pointLabels = showGroups[0].points.map(p => `测点${p.no}`);
      // 构造数据集
      const chartDatasets = showGroups.map((group, index) => {
        return {
          label: group.name,
          data: group.points.map(point => {
            switch (activeTab) {
              case 'totalHead': return point.totalHead;
              case 'pressureHead': return point.pressureHead;
              case 'velocityHead': return point.velHead;
              case 'positionHead': return point.height;
              default: return point.totalHead;
            }
          }),
          borderColor: colorList[index % colorList.length],
          backgroundColor: `${colorList[index % colorList.length]}33`,
          pointBackgroundColor: '#ffffff',
          pointBorderColor: colorList[index % colorList.length],
          pointBorderWidth: 2,
          fill: false,
          borderWidth: 3
        };
      });
      // 更新图表数据
      mainChart.data.labels = pointLabels;
      mainChart.data.datasets = chartDatasets;
      mainChart.options.plugins.title.text = getTabTitle();
      mainChart.update();
    }

    // 导出CSV数据
    function exportCsvData() {
      // 先计算所有数据
      experimentList.forEach(group => {
        if (!group.points[0] || group.points[0].totalHead === undefined) {
          calculateHeadData(group.id);
        }
      });
      // 构造CSV头部
      let csvContent = '\ufeff实验组,测点编号,管径d(mm),位置高度z(m),测压管水头h(m),流速(m/s),流速水头(m),总水头(m),体积流量Q(m³/h)\n';
      // 拼接数据行
      experimentList.forEach(group => {
        group.points.forEach(point => {
          csvContent += `${group.name},${point.no},${point.diameter},${point.height},${point.pressureHead},${point.velocity.toFixed(4)},${point.velHead.toFixed(6)},${point.totalHead.toFixed(6)},${group.flow}\n`;
        });
      });
      // 生成文件并下载
      const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
      const downloadLink = document.createElement('a');
      downloadLink.href = URL.createObjectURL(blob);
      downloadLink.download = `柏努利实验数据_${new Date().toLocaleDateString().replace(/\//g, '-')}.csv`;
      downloadLink.click();
      showTip('实验数据已成功导出为CSV文件！');
    }

    // 导入CSV数据
    function readCsvFile(event) {
      const file = event.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(e) {
        try {
          const text = e.target.result;
          const lines = text.split('\n').filter(line => line.trim());
          if (lines.length < 2) {
            showTip('CSV文件无有效数据', 'error');
            return;
          }
          // 解析数据
          const dataMap = {};
          for (let i = 1; i < lines.length; i++) {
            const values = lines[i].split(',').map(v => v.trim());
            if (values.length >= 5) {
              const groupName = values[0];
              if (!dataMap[groupName]) {
                dataMap[groupName] = { name: groupName, flow: parseFloat(values[8]) || 1.5, points: [] };
              }
              dataMap[groupName].points.push({
                no: parseInt(values[1]),
                diameter: parseFloat(values[2]),
                height: parseFloat(values[3]),
                pressureHead: parseFloat(values[4])
              });
            }
          }
          // 转换为实验组列表
          experimentList = Object.values(dataMap).map((g, idx) => {
            return {
              id: idx + 1,
              name: g.name,
              flow: g.flow,
              points: g.points.sort((a, b) => a.no - b.no)
            };
          });
          // 重新渲染并绘制图表
          renderAllGroups();
          renderAllCharts();
          showTip(`成功导入 ${experimentList.length} 个实验组数据！`);
        } catch (error) {
          showTip(`CSV导入失败：${error.message}`, 'error');
        }
      };
      reader.readAsText(file);
      event.target.value = ''; // 重置文件输入
    }

    // 生成实验报告
    function createExperimentReport() {
      // 先计算所有数据
      experimentList.forEach(group => {
        if (!group.points[0] || group.points[0].totalHead === undefined) {
          calculateHeadData(group.id);
        }
      });

      // 统计全局数据
      let totalLoss = 0, maxVel = 0, minTotalH = Infinity, maxTotalH = -Infinity;
      const groupStats = [];
      // 遍历每组统计
      experimentList.forEach(group => {
        const headList = group.points.map(p => p.totalHead);
        const groupMaxH = Math.max(...headList);
        const groupMinH = Math.min(...headList);
        const headLoss = groupMaxH - groupMinH;
        const groupMaxVel = Math.max(...group.points.map(p => p.velocity));
        const avgHead = headList.reduce((a, b) => a + b, 0) / headList.length;

        totalLoss += headLoss;
        maxVel = Math.max(maxVel, groupMaxVel);
        minTotalH = Math.min(minTotalH, groupMinH);
        maxTotalH = Math.max(maxTotalH, groupMaxH);
        groupStats.push({ name: group.name, flow: group.flow, avgHead, headLoss, maxVel });
      });
      // 计算平均值
      const avgLoss = experimentList.length > 0 ? totalLoss / experimentList.length : 0;
      const totalHeadDiff = maxTotalH - minTotalH;
      // 验证结果判断
      const verifyResult = totalHeadDiff < 0.05 ? 
        { text: '实验数据精度良好，柏努利方程得到有效验证', bg: '#dcfce7', border: '#bbf7d0', color: '#166534' } :
        { text: '实验数据存在一定偏差，建议检查测量仪器精度或实验操作规范', bg: '#fff3cd', border: '#ffed4a', color: '#92400e' };

      // 构造报告HTML
      let statsHtml = '';
      groupStats.forEach(stat => {
        statsHtml += `<tr>
          <td style="padding:12px; font-weight:600;">${stat.name}</td>
          <td style="padding:12px;">${stat.flow}</td>
          <td style="padding:12px;">${stat.avgHead.toFixed(4)}</td>
          <td style="padding:12px; color:${stat.headLoss > 0.1 ? '#e74c3c' : '#27ae60'}">${stat.headLoss.toFixed(4)}</td>
          <td style="padding:12px;">${stat.maxVel.toFixed(3)}</td>
        </tr>`;
      });

      const reportHtml = `
        <div class="report-content">
          <h3>柏努利方程实验分析报告</h3>
          <div>
            <h4>一、实验原理</h4>
            <div class="principle-box">
              <p style="font-size:16px;"><strong>柏努利方程核心公式：</strong> z₁ + p₁/ρg + v₁²/2g = z₂ + p₂/ρg + v₂²/2g + h_f</p>
              <p style="margin-top:10px; font-size:15px; color:#64748b;">
                式中：z为位置水头，p/ρg为测压管水头，v²/2g为流速水头，h_f为水头损失；<br>
                理想流体定常流动时，总水头（z + p/ρg + v²/2g）沿程不变，实际流体因存在能量损失，总水头沿程递减。
              </p>
            </div>
          </div>
          <div>
            <h4>二、实验组数据统计</h4>
            <table style="width:100%; border-collapse:collapse; margin:10px 0;">
              <thead>
                <tr style="background:linear-gradient(45deg, #2980b9, #6dd5fa); color:#fff;">
                  <th style="padding:15px; text-align:center;">实验组</th>
                  <th style="padding:15px; text-align:center;">体积流量(m³/h)</th>
                  <th style="padding:15px; text-align:center;">平均总水头(m)</th>
                  <th style="padding:15px; text-align:center;">水头损失(m)</th>
                  <th style="padding:15px; text-align:center;">最大流速(m/s)</th>
                </tr>
              </thead>
              <tbody>${statsHtml}</tbody>
            </table>
            <div style="margin-top:20px; display:flex; gap:20px; flex-wrap:wrap;">
              <div class="stat-card"><h4>全局最大流速</h4><p>${maxVel.toFixed(3)} m/s</p></div>
              <div class="stat-card"><h4>平均水头损失</h4><p>${avgLoss.toFixed(4)} m</p></div>
              <div class="stat-card"><h4>总水头最大差值</h4><p>${totalHeadDiff.toFixed(4)} m</p></div>
            </div>
          </div>
          <div>
            <h4>三、实验结论与分析</h4>
            <div class="conclusion-box" style="background:${verifyResult.bg}; border:1px solid ${verifyResult.border}; color:${verifyResult.color};">
              <p style="font-size:16px; font-weight:600;">${verifyResult.text}</p>
              <p style="margin-top:10px; font-size:15px;">
                本次实验共设置 ${experimentList.length} 个实验组，测点总数 ${experimentList.reduce((a,b)=>a+b.points.length,0)} 个；<br>
                实验测得最大流速为 ${maxVel.toFixed(3)} m/s，平均水头损失为 ${avgLoss.toFixed(4)} m，总水头最大差值为 ${totalHeadDiff.toFixed(4)} m。
              </p>
            </div>
          </div>
        </div>
      `;
      // 渲染报告
      document.getElementById('report-container').innerHTML = reportHtml;
      showTip('实验报告已生成完成！');
    }
  </script>
</body>
</html>
